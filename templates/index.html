{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <form class="search" method="get">
      <input type="text" name="q" placeholder="Search name, email, phone..." value="{{ q }}">
      <button class="btn secondary" type="submit">Search</button>
    </form>
    <a class="btn" href="{{ url_for('create') }}">+ Add Contact</a>
  </div>
  {% if items %}
  <table>
    <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
    <tbody>
    {% for it in items %}
      <tr>
        <td>{{ it.id }}</td>
        <td>{{ it.name }}</td>
        <td>{{ it.email }}</td>
        <td>{{ it.phone or '-' }}</td>
        <td class="actions">
          <a class="btn sm secondary" href="{{ url_for('edit', item_id=it.id) }}">Edit</a>
          <form class="inline" method="post" action="{{ url_for('delete', item_id=it.id) }}" data-name="{{ it.name }}" onsubmit="return confirm('Delete ' + this.dataset.name + '?');">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <button class="btn sm danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% else %}
    <div class="empty">Koi contact nahi mila. "+ Add Contact" pe click karo.</div>
  {% endif %}
</div>
{% endblock %}
